<script defer src="https://cloud.umami.is/script.js" data-website-id="68bdfc5b-1fd6-4fef-876e-a24334b8cd87" data-domains="ahojira.cz,www.ahojira.cz"></script>
<style>
  /* ahojira.cz - сайт блога Иры (Миша, 27.10.26). Палитра и шрифты - как у сторис «Скидки недели» (036_ira_stories).
     v2: текст главный, фото полоской; у каждой карточки кнопка с ценой; одна колонка; первая скидка видна без прокрутки.
     Скидки - массив DEALS внизу, обновлять каждый понедельник: даты в WEEK, строки в DEALS, фото в img/d_<id>.jpg. */
  @font-face { font-family: Corm; src: url(fonts/Cormorant-Italic.woff2) format('woff2'); font-weight: 300 700; font-style: italic; font-display: swap; }
  @font-face { font-family: Onest; src: url(fonts/Onest.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: Unb; src: url(fonts/Unbounded.woff2) format('woff2'); font-weight: 200 900; font-display: swap; }
  :root { --choc: #2B1A12; --card: #3A2419; --card2: #45291D; --peach: #F4B48E; --butter: #F2DB98; --cream: #F6ECDF;
    --dim: rgba(246,236,223,.66); --line: rgba(244,180,142,.24); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; -webkit-text-size-adjust: 100%; }
  body { background: var(--choc); color: var(--cream); font-family: Onest, system-ui, sans-serif; font-size: 18px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  #grain { position: fixed; inset: 0; z-index: 50; pointer-events: none; opacity: .08; mix-blend-mode: overlay; background-size: 220px 220px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); }
  #warm { position: absolute; inset: 0 0 auto 0; height: 420px; pointer-events: none;
    background: linear-gradient(180deg, rgba(176,106,72,.5), rgba(176,106,72,.12) 60%, rgba(43,26,18,0)); }
  .wrap { position: relative; max-width: 620px; margin: 0 auto; padding: 0 16px; }

  /* шапка в одну строку: аватарка, имя, кнопка Инсты - чтобы первая скидка влезла в первый экран */
  header { display: flex; align-items: center; gap: 14px; padding: 22px 0 0; }
  .ava { flex: 0 0 64px; height: 64px; border-radius: 50%; padding: 3px; background: var(--choc); box-shadow: 0 0 0 2.5px var(--peach); }
  .ava img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-family: Corm; font-style: italic; font-weight: 600; font-size: 34px; line-height: 1; color: var(--peach); }
  .who span { display: block; margin-top: 4px; font-size: 16px; color: var(--butter); }
  .ig { flex: 0 0 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
  .ig svg { width: 22px; height: 22px; }

  .week { padding: 26px 0 0; }
  .week h1 { font-family: Corm; font-style: italic; font-weight: 600; font-size: 52px; line-height: 1; letter-spacing: -1px; color: var(--cream); }
  .week p { margin-top: 8px; font-size: 18px; color: var(--dim); }
  .week p b { color: var(--butter); font-weight: 600; }

  /* вкладки групп: крупные, липнут к верху; на узком экране листаются пальцем */
  nav { position: sticky; top: 0; z-index: 20; margin: 18px -16px 0; padding: 12px 16px;
    background: rgba(43,26,18,.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(244,180,142,.12); }
  nav .row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  nav .row::-webkit-scrollbar { display: none; }
  /* у каждой группы свой цвет (--g): вкладка, рамка блока, заголовок, скидка, цена (Миша 27.10.26: «раздели, выдели цветами») */
  #her { --g: #F4B48E; } #him { --g: #F2DB98; } #kids { --g: #A9CDA2; } #two { --g: #E9967A; }
  nav a { flex: 0 0 auto; height: 48px; display: flex; align-items: center; gap: 9px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 18px;
    color: var(--cream); background: rgba(246,236,223,.06); box-shadow: inset 0 0 0 1.5px var(--line); transition: background .2s ease-out, color .2s ease-out; }
  nav a::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--g); }
  nav a.on { background: var(--g); color: var(--choc); box-shadow: none; }
  nav a.on::before { background: var(--choc); }

  /* группа - отдельный блок своего цвета; между блоками пусто, внутри карточки плотно */
  main { display: flex; flex-direction: column; gap: 40px; padding-top: 26px; }
  section { padding: 22px 12px 12px; border-radius: 28px; background: color-mix(in oklab, var(--g) 9%, var(--choc));
    box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--g) 38%, transparent); }
  section h2 { margin: 0 8px 16px; font-family: Corm; font-style: italic; font-weight: 600; font-size: 44px; line-height: 1; letter-spacing: -.5px; color: var(--g); }
  .list { display: flex; flex-direction: column; gap: 12px; }

  /* карточка: фото целиком сверху (у Slevomat все фото 2:1 - так ничего не режется), скидка крупно на фото; ниже что, где, цена.
     Нажимается вся карточка (Миша 27.10.26: квадрат резал лица) */
  .card { display: block; border-radius: 20px; overflow: hidden; background: rgba(43,26,18,.72); transition: background .2s ease-out, transform .15s ease-out; }
  .card:hover { background: rgba(43,26,18,.95); }
  .card:active { transform: scale(.985); }
  .ph { position: relative; aspect-ratio: 2 / 1; overflow: hidden; background: var(--choc); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; filter: saturate(.92) sepia(.08); }
  /* скидка крупно (Миша 27.10.26: «не видно, какая скидка») */
  .off { position: absolute; left: 0; bottom: 0; padding: 10px 16px 9px 14px; border-radius: 0 16px 0 0; background: var(--g); color: var(--choc);
    font-family: Unb; font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .bd { padding: 14px 16px 16px; }
  .what { display: block; font-weight: 700; font-size: 22px; line-height: 1.2; color: var(--cream); text-wrap: balance; }
  .pl { display: block; margin-top: 4px; font-size: 16px; line-height: 1.3; color: var(--dim); }
  .price { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .price em { font-style: normal; font-weight: 800; font-size: 26px; color: var(--g); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price svg { flex: 0 0 auto; width: 40px; height: 40px; padding: 11px; border-radius: 50%; background: var(--g); color: var(--choc); }

  footer { margin-top: 48px; padding: 28px 0 48px; border-top: 1px solid rgba(244,180,142,.14); text-align: center; font-size: 16px; color: var(--dim); }
  footer p + p { margin-top: 8px; }
  footer .ig2 { display: inline-flex; align-items: center; gap: 10px; height: 52px; margin-bottom: 20px; padding: 0 22px; border-radius: 999px;
    box-shadow: inset 0 0 0 1.5px var(--line); color: var(--cream); font-weight: 600; font-size: 18px; }
  footer .ig2 svg { width: 20px; height: 20px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="warm"></div>
<div class="wrap">

    <div class="ava"><img src="img/ira.jpg" alt="Ира"></div>

    <a class="ig" href="https://www.instagram.com/ahoj_ira/" target="_blank" rel="noopener" data-umami-event="Инстаграм (шапка)" aria-label="Инстаграм Иры">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
    </a>
  </header>

  <div class="week">
    <h1>Скидки недели</h1>
    <p><b id="week"></b> · обновляю каждый понедельник</p>
  </div>

  <nav><div class="row" id="tabs"></div></nav>
  <main id="groups"></main>

  <footer>
    <a class="ig2" href="https://www.instagram.com/ahoj_ira/" target="_blank" rel="noopener" data-umami-event="Инстаграм (низ)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      @ahoj_ira
    </a>
    <p>Цены и скидки - со Slevomat на начало недели, могут поменяться.</p>
    <p>Ссылки партнёрские: вам цена та же, а блогу это помогает.</p>
  </footer>
</div>
<div id="grain"></div>

<script>
const WEEK = '27.10 - 2.11';
const AFF = '?utm_source=affiliate&utm_medium=cpc&utm_campaign=dis_akv_gen_cze_all_buy_ahojira_ahojiraCZ&utm_content=web&utm_term=ahojira';
const COLORS = { her: '#F4B48E', him: '#F2DB98', kids: '#A9CDA2', two: '#E9967A' };   // те же, что #her... в стилях
const GROUPS = [['her', 'Для неё'], ['him', 'Для него'], ['kids', 'Для деток'], ['two', 'Вдвоём']];
// [группа, id акции Slevomat, скидка, что, место, район, цена]
const DEALS = [
  ['her',  '2456000-kralovske-vanocni-balicky-s-masazi-pro-zeny-pro-muze-i-pary', 69, 'Спа-ритуал 1,5 часа', 'Royal Jasmine Spa', 'Staré Město', '879'],
  ['her',  '2457494-az-60-minut-relaxacni-masaze-v-centru-prahy', 60, 'Массаж 30 минут', 'Thajský ráj', 'Staré Město', '315'],
  ['her',  '2402362-mikrojehlickova-mezoterapie-s-kyselinou-hyaluronovou', 47, 'Мезотерапия лица', 'Face Secret Studio', 'Nové Město', '999'],
  ['him',  '2441566-namichejte-si-vlastni-rum-2hodinovy-kurz-s-degustaci', 36, 'Свой ром с дегустацией', 'Barstars', 'Smíchov', '999'],
  ['him',  '2428112-historicka-show-5chodove-menu-a-neomezene-napoje', 28, 'Средневековое шоу с ужином', 'Krčma U Pavouka', 'Staré Město', '1 299'],
  ['him',  '2428872-detektivni-unikova-hra-predstirana-smrt', 23, 'Детективный квест', 'HiddenStory', 'Vinohrady', '1 299'],
  ['him',  '2433612-doubleburger-s-tuplakem-piva-u-i-p-pavlova', 22, 'Двойной бургер и литр пива', 'Restaurace Legenda', 'Nové Město', '399'],
  ['kids', '2437904-s-rodinou-za-rybkami-vstup-do-morskeho-sveta', 29, 'Морской аквариум', 'Mořský svět', 'Bubeneč', '299'],
  ['kids', '2434556-nejnovejsi-listopadova-show-cirkusu-humberto-v-prazskych-letnanech', 25, 'Цирк Humberto', 'Cirkus Humberto', 'Letňany', '299'],
  ['kids', '2441380-ve-vsedni-den-do-detskeho-centra-s-mnoha-atrakcemi', 20, 'Детский игровой центр', 'Tanzania Park', 'Horní Měcholupy', '159'],
  ['two',  '2432952-3chodove-menu-s-vyhledem-na-karluv-most-pro-1-ci-2', 38, 'Ужин с видом на Карлов мост', 'Charles Bridge restaurant', 'Nové Město', '699'],
  ['two',  '2437564-privatni-wellness-s-pizzou-a-billiardem-1-3-hod', 37, 'Приватный велнес с пиццей', 'Hotel Otakar', 'Nusle', '599'],
];

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
document.getElementById('week').textContent = WEEK;
document.getElementById('tabs').innerHTML = GROUPS.map(([k, t]) => `<a href="#${k}" data-k="${k}" style="--g:${COLORS[k]}" data-umami-event="вкладка: ${t}">${t}</a>`).join('');
document.getElementById('groups').innerHTML = GROUPS.map(([k, t]) =>
  `<section id="${k}"><h2>${t}</h2><div class="list">` + DEALS.filter(d => d[0] === k).map(([, slug, off, what, place, area, price]) =>
    `<a class="card" href="https://www.slevomat.cz/akce/${slug}${AFF}" target="_blank" rel="sponsored noopener" data-umami-event="${esc(what)}" data-umami-event-group="${t}" data-umami-event-off="-${off}%">
      <div class="ph"><img src="img/d_${slug.split('-')[0]}.jpg" alt="" loading="lazy"><span class="off">-${off}%</span></div>
      <div class="bd">
        <span class="what">${esc(what)}</span>
        <span class="pl">${esc(place)}</span>
        <div class="price"><em>${price}&nbsp;Kč</em><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></div>
      </div>
    </a>`).join('') + '</div></section>'
).join('');

// подсветка вкладки той группы, что сейчас на экране
const tabs = [...document.querySelectorAll('#tabs a')];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  tabs.forEach(a => a.classList.toggle('on', a.dataset.k === e.target.id));
}), { rootMargin: '-30% 0px -65% 0px' });
document.querySelectorAll('section').forEach(s => io.observe(s));
</script>
